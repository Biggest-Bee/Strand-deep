name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/strand-deep${suffix}" "dist/strand-deep${suffix}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "strand-deep-${{ matrix.target }}.zip" "strand-deep.exe"
          else
            tar -czf "strand-deep-${{ matrix.target }}.tar.gz" "strand-deep"
          fi

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
