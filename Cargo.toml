[package]
name = "strand-deep"
version = "2026.11.21"
edition = "2021"
description = "Demand-driven interprocedural analysis for dynamic imports - research companion to Strand"
license = "Apache-2.0"

[dependencies]
strand-core = "0.2.1"
strand-import = "0.13.0"
tree-sitter = "0.27.2"
tree-sitter-python = "0.25.0"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
